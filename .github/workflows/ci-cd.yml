name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------
  # Stage 1: Unit tests + coverage report
  # ---------------------------------------------------------------------
  test:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always()
        run: |
          node -e "
            const { total } = require('./coverage/coverage-summary.json');
            const rows = Object.entries(total)
              .map(([k, v]) => \`| \${k} | \${v.pct}% (\${v.covered}/\${v.total}) |\`)
              .join('\n');
            console.log('## Coverage summary\n\n| Metric | Value |\n| --- | --- |\n' + rows);
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/junit.xml
          retention-days: 30

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ---------------------------------------------------------------------
  # Stage 2: UAT - deploy to the UAT environment and run acceptance tests
  # ---------------------------------------------------------------------
  uat:
    name: Deploy to UAT & run acceptance tests
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (UAT)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.API_key }}
          accountId: ${{ secrets.ACCOUNT_ID }}
          command: d1 migrations apply p6 --env uat --remote

      - name: Deploy to UAT
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.API_key }}
          accountId: ${{ secrets.ACCOUNT_ID }}
          command: deploy --env uat

      - name: Run UAT acceptance tests
        run: npm run test:uat
        env:
          UAT_URL: ${{ vars.UAT_URL }}

      - name: Publish UAT test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-test-results
          path: test-results/uat-junit.xml
          retention-days: 30

  # ---------------------------------------------------------------------
  # Stage 3: Production - deploy to production once UAT has passed
  # ---------------------------------------------------------------------
  production:
    name: Deploy to Production
    needs: uat
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.API_key }}
          accountId: ${{ secrets.ACCOUNT_ID }}
          command: d1 migrations apply p6 --env production --remote

      - name: Deploy to Production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.API_key }}
          accountId: ${{ secrets.ACCOUNT_ID }}
          command: deploy --env production
